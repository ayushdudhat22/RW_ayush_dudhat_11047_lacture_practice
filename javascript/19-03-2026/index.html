<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .slider-container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px #a0a0a0;
        }

        .slides {
            display: flex;
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 450px;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .next{
            right:15px;
        }
        .prev{
            left:15px;
        }

        .prev:hover,
        .next:hover {
            background: #303030;
            color:white;
        }

        .dots{
            text-align: center;
            height: 10px;
            width: 10px;
            background-color: #bbb;
            border-radius: 100%;
            display: flex;
            cursor: pointer;
            transition: background-color 0.6s transform 0.3s;
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            margin: auto;
        }

        .dots:active , .dots:hover{
            background-color: #333;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <!-- Image Slider -->

    <div class="slider-container">
        <div class="slides" id="slides">
            <div class="slide">
                <img src="./img/WhatsApp Image 2026-02-26 at 1.43.43 PM (5).jpeg"
                    alt="image-slides">
                <div class="caption">shree ram</div>
            </div>
            <div class="slide">
                <img src="./img/WhatsApp Image 2026-02-26 at 1.43.43 PM (4).jpeg"
                    alt="image-slides">
                <div class="caption">Steve Jobs</div>
            </div>
            <div class="slide">
                <img src="./img/WhatsApp Image 2026-02-26 at 1.43.47 PM.jpeg"
                    alt="image-slides">
                <div class="caption">shree ganesha</div>
            </div>
            <div class="slide">
                <img src="./img/WhatsApp Image 2026-02-26 at 1.43.44 PM.jpeg"
                    alt="image-slides">
                <div class="caption">swami vivekananda</div>
            </div>
            <div class="slide">
                <img src="./img/WhatsApp Image 2026-02-26 at 1.43.45 PM.jpeg"
                    alt="image-slides">
                <div class="caption">apj abdul kalam</div>
            </div>
        </div>
        <button class="prev" onclick="moveSlide(-1)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="next" onclick="moveSlide(1)"><i class="fa-solid fa-arrow-right"></i></button>
        <script src="./script.js"></script>
        <div class="dots" id="dots"></div>
    </div>
</body>

</html>
