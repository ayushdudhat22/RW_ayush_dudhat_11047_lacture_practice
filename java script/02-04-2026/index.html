<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>

        .formContent {
            max-width: 500px;
            margin: auto;
            background-color: rgb(159, 159, 161);
            padding: 20px;
        }
        .error{
            color:red;
        }
    </style>
</head>
<body>
    <!-- Form Validation using Javascript -->
    <div class="container mx-auto">
        <div class="formContent vh-100 align-items-center d-flex ">
            <form class="row g-3" id="my-form">
                <div class="col-md-12">
                    <label for="inputname4" class="form-label">Name</label>
                    <input type="text" class="form-control" id="inputname4">
                    <div id="nameError" class="error"></div>
                </div>
                <div class="col-md-12">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail4">
                    <div id="emailError" class="error"></div>
                </div>
                <div class="col-md-12">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword4">
                    <div id="passwordError" class="error"></div>
                </div>
                <div class="col-md-12">
                    <div class="row">
                        <div class="col-md-6">
                            <select id="courses" class="form-select">
                                <option value="">Select Course</option>
                                <option value="javascript">Javascript</option>
                                <option value="reactjs">Reactjs</option>
                                <option value="nodejs">Nodejs</option>
                            </select>
                            <div id="coursesError" class="error"></div>
                        </div>
                        <div class="col-md-6">
                            <!-- Radio -->
                            <label >
                                <input type="radio" class="form-check-input" name="gender" value="male">
                                Male
                            </label>
                            <label>
                                <input type="radio" class="form-check-input" name="gender" value="female">
                                Female
                            </label>
                            <div id="genderError" class="error"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="inputage" class="form-label">Age</label>
                    <input type="number" class="form-control" id="inputage">
                    <div id="ageError" class="error"></div>
                </div>
                <div class="col-md-6">
                    <label for="inputZip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputZip">
                    <div id="zipError" class="error"></div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck">
                        <label class="form-check-label" for="gridCheck">
                            Check me out
                        </label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
