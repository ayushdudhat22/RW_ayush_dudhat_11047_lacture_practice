<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .demo-box{
            display:flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .slide-area {
            font-size: 6rem;
            text-align: center;
            padding: 50px;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            width: 100%;
        }
        .btn-row{
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            align-items: center;
            width: 200px;
        }
        .btn{
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <!-- Slide Section -->

    <div>
        <p style="text-align: center; font-family: Arial, Helvetica, sans-serif;">Live Demo</p>
        <div class="demo-box">
            <div class="slide-area" id="slide"></div>
            <div class="btn-row">
                <button class="btn" id="next">Next</button>
                <span class="counter" id="counter"></span>
                <button class="btn" id="prev">Prev</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
